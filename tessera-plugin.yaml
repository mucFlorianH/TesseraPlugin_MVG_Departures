# Reads the departures attribute from a user-selected Another MVG sensor.
id: mvg_departures
version: 0.1.1
api: "0.15"
icon: bus
maintainer: mucFlorianH
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: probe
    name: departure_tile
    icon: bus
    sizes: { min: 1x1, max: 9x9 }
    memory: 500
    domains: [sensor]
    attributes: [departures]
    has_attributes: [departures]
    example: probe_example
    preview: { badge: "{state}", title: "{name}" }
