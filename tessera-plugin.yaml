# Reads departures from a flattened Home Assistant template sensor.
id: mvg_departures
version: 0.1.28
api: "0.15"
icon: bus
maintainer: mucFlorianH
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: probe
    name: departure_tile
    icon: bus
    sizes: { min: 1x1, max: 9x9 }
    memory: 500
    domains: [sensor]
    attributes:
      - departure_type
      - departure_line
      - departure_destination
      - departure_track
      - departure_expected
      - departure_delay
      - departure_cancelled
      - station_name
    has_attributes: [departure_line]
    example: probe_example
    preview: { title: "{station_name}", value: "{state}" }
    options:
      - id: transport_modes
        kind: choice
        multiple: 4
        default: []
        label: transport_modes
        hint: transport_modes_hint
        choices:
          - { value: bus, label: mode_bus }
          - { value: u_bahn, label: mode_u_bahn }
          - { value: s_bahn, label: mode_s_bahn }
          - { value: tram, label: mode_tram }
