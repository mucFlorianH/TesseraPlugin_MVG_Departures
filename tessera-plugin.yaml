# Reads departures from a selected Another MVG sensor or a structured Home Assistant template sensor.
id: mvg_departures
version: 0.1.23
api: "0.15"
icon: bus
maintainer: mucFlorianH
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: probe
    name: departure_tile
    icon: bus
    sizes: { min: 1x1, max: 9x9 }
    memory: 500
    domains: [sensor]
    attributes:
      - departures
      - departure_type
      - departure_line
      - departure_destination
      - departure_track
      - departure_expected
      - departure_delay
      - departure_cancelled
      - station_name
    has_attributes: [departures]
    fields:
      transport_type_1: { path: "departures[0].transport_type" }
      line_1: { path: "departures[0].label" }
      destination_1: { path: "departures[0].destination" }
      departure_time_1: { path: "departures[0].expected_departure" }
      transport_type_2: { path: "departures[1].transport_type" }
      line_2: { path: "departures[1].label" }
      destination_2: { path: "departures[1].destination" }
      departure_time_2: { path: "departures[1].expected_departure" }
    example: probe_example
    preview: { badge: "{line_1}", title: "{destination_1}", value: "{departure_time_1}" }
    options:
      - id: transport_modes
        kind: choice
        multiple: 4
        default: []
        label: transport_modes
        hint: transport_modes_hint
        choices:
          - { value: bus, label: mode_bus }
          - { value: u_bahn, label: mode_u_bahn }
          - { value: s_bahn, label: mode_s_bahn }
          - { value: tram, label: mode_tram }
