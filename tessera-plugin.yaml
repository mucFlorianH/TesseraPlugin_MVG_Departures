# Reads generic departure fields from a user-selected Another MVG sensor.
id: mvg_departures
version: 0.1.3
api: "0.15"
icon: bus
maintainer: mucFlorianH
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: probe
    name: departure_tile
    icon: bus
    sizes: { min: 1x1, max: 9x9 }
    memory: 500
    domains: [sensor]
    has_attributes: [departures]
    fields:
      transport_type: { path: "departures[0].transport_type" }
      line: { path: "departures[0].label" }
      destination: { path: "departures[0].destination" }
      departure_time: { path: "departures[0].expected_departure" }
    example: probe_example
    preview: { badge: "{line}", title: "{destination}", value: "{departure_time}" }
